[project]
name = "pixelflow"
version = "0.1.0"
description = "Lightweight image metadata validator and parser"
authors = [{ name = "PixelFlow Maintainers" }]
dependencies = []
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

