name: BugBounty Hunter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install greenlet
          pip install -r apps/api/requirements.txt

      - name: Install fixture package (pixelflow)
        run: |
          pip install -e fixtures/sample-buggy-repo

      - name: Run Backend Pytest Suite
        working-directory: apps/api
        run: |
          pytest -v --tb=short 2>&1 | tee pytest_run.log || {
            echo "### Pytest Failure Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 pytest_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Fixture Repo Baseline Tests
        working-directory: fixtures/sample-buggy-repo
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend dependencies
        working-directory: apps/web
        run: npm install

      - name: Lint Frontend
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js Application
        working-directory: apps/web
        run: npm run build
